[package]
name = "app"
version = "3.12.0"
description = "单机加密日记"
authors = ["you"]
edition = "2021"
publish = false

# Member of the workspace declared in ../../Cargo.toml.
# [profile.*] deliberately does NOT appear here: Cargo ignores profiles inside
# workspace members, so the release profile lives at the workspace root.

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name
# unique and to avoid conflicting with the bin name. See
# https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri 官方模板的标准一段：打开后构建产物会**内嵌** dist（走 frontendDist），
# 关掉则走 devUrl、去连 localhost:1420 的开发服务器。
#
# ⚠️ 2026-09-22 补：这份 manifest 一直缺这一段。以前每次都用 `tauri build` 构建，
#    CLI 会在命令行上顺手把这个 feature 打开，所以从来没暴露出来。一旦绕过 CLI 直接
#    `cargo build --release`，编出来就是个 **dev 版**——能启动、窗口也建得出来，
#    但里面是"无法访问此页面"（它在连 localhost:1420）。排查经过见 生产日志 坑表。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Database: SQLCipher (whole-file encryption). The key is derived in Rust and
# never handed to the frontend, which is exactly why the official
# tauri-plugin-sql is not used here -- it is built around passing SQL strings
# from the frontend and does not support SQLCipher.
rusqlite = { workspace = true }

# PIN -> database key derivation.
argon2 = { workspace = true }
rand = { workspace = true }

# Chinese full-text search segmentation.
jieba-rs = { workspace = true }

# Error types for the command boundary, so the UI can show something meaningful
# instead of a raw driver error.
thiserror = { workspace = true }

# Attachments (P1 #10): sha256 names the stored file (so the same image inserted
# twice is stored once), base64 carries the original file name through an IPC
# header. Both are already in the lockfile as transitive dependencies -- that
# matters because this machine cannot fetch new crates at all.
sha2 = { workspace = true }
base64 = { workspace = true }

# Auto-start on login (【P2-13】): writes one value under
# HKCU\...\CurrentVersion\Run. Already in the lockfile (transitive), so this
# pulls nothing from the network -- which matters, see the note above.
# Only ever HKCU: writing HKLM would need administrator rights.
winreg = { workspace = true }

# NOTE: the `directories` crate was removed on purpose.
# The app is portable: its data lives in a `data/` folder found by walking up
# from the executable, not in the platform AppData directory. See
# commands::resolve_data_dir. Keeping the dependency would just be dead weight.
